<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Record Shelf</title>
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: #0a0a0a;
				color: #fafafa;
				display: flex;
				min-height: 100vh;
				margin: 0;
				align-items: center;
				justify-content: center;
				text-align: center;
			}
			.wrap {
				padding: 2rem;
				max-width: 28rem;
			}
			svg {
				width: 64px;
				height: 64px;
				opacity: 0.6;
				margin-bottom: 1rem;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: #a3a3a3;
				line-height: 1.6;
				margin: 0 0 1.5rem;
			}
			a.retry {
				display: inline-block;
				background: linear-gradient(135deg, #6366f1, #8b5cf6);
				color: #fff;
				text-decoration: none;
				border-radius: 10px;
				padding: 0.75rem 1.5rem;
				font-size: 0.9375rem;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2.5" />
				<circle cx="24" cy="24" r="10" stroke="currentColor" stroke-width="1.5" opacity="0.5" />
				<circle cx="24" cy="24" r="4" fill="currentColor" />
			</svg>
			<h1>You're offline</h1>
			<p>
				Record Shelf needs a connection to load collection data from Discogs. Check your network and
				try again.
			</p>
			<a class="retry" href="/">Try again</a>
		</div>
	</body>
</html>
