<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
	<style>
		.ground { fill: #ECEEE8; }
		.ring { fill: none; stroke: #18201C; stroke-width: 3; }
		.dot { fill: #18201C; }
		@media (prefers-color-scheme: dark) {
			.ground { fill: #131815; }
			.ring { stroke: #E8EBE3; }
			.dot { fill: #E8EBE3; }
		}
	</style>
	<rect class="ground" width="48" height="48" />
	<circle class="ring" cx="24" cy="24" r="16" />
	<circle class="dot" cx="24" cy="24" r="4" />
</svg>
